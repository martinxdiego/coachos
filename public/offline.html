<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>CoachOS – Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background:
          radial-gradient(circle at 50% 0%, #064e3b 0, transparent 45%),
          #020617;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding:
          calc(1.5rem + env(safe-area-inset-top))
          calc(1.25rem + env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom))
          calc(1.25rem + env(safe-area-inset-left));
      }
      main {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 1.5rem;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        max-width: 32rem;
        padding: clamp(1.5rem, 6vw, 2.5rem);
        text-align: center;
      }
      .icon {
        align-items: center;
        background: rgba(16, 185, 129, 0.14);
        border-radius: 1rem;
        color: #6ee7b7;
        display: inline-flex;
        font-size: 1.5rem;
        height: 3.5rem;
        justify-content: center;
        width: 3.5rem;
      }
      h1 {
        font-size: clamp(1.75rem, 7vw, 2.25rem);
        letter-spacing: -0.035em;
        margin: 1.25rem 0 0.75rem;
      }
      p {
        color: #cbd5e1;
        line-height: 1.65;
        margin: 0;
      }
      a {
        background: #10b981;
        border-radius: 0.85rem;
        color: #022c22;
        display: inline-flex;
        font-weight: 700;
        justify-content: center;
        margin-top: 1.5rem;
        min-height: 3rem;
        padding: 0.8rem 1.25rem;
        text-decoration: none;
        width: 100%;
      }
      a:focus-visible {
        outline: 3px solid #a7f3d0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true" class="icon">⌁</span>
      <h1>Du bist offline</h1>
      <p>
        Sobald die Verbindung wieder da ist, kannst du CoachOS wie gewohnt
        nutzen. Persönliche und medizinische Seiten legt CoachOS nicht im
        Offline-Cache der App ab.
      </p>
      <a href="/">Erneut versuchen</a>
    </main>
  </body>
</html>
