name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build can compile. Pages are force-dynamic and
          # never hit the database at build time; the pg Pool connects lazily.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NEXT_PUBLIC_SUPABASE_URL: https://build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
