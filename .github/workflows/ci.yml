name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build can compile. Pages are force-dynamic and
          # never hit the database at build time; the pg Pool connects lazily.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NEXT_PUBLIC_SUPABASE_URL: https://build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coachos
          POSTGRES_PASSWORD: coachos
          POSTGRES_DB: coachos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coachos -d coachos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coachos:coachos@127.0.0.1:5432/coachos_e2e
      DIRECT_URL: postgresql://coachos:coachos@127.0.0.1:5432/coachos_e2e
      AUTH_SECRET: ci-only-auth-secret-that-is-long-enough-for-tests
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://build.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-service-role-key
      EMAIL_VERIFICATION_REQUIRED: "false"
      BILLING_ENFORCE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
